<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Команди — SportHub</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/style/main.css">
    <link rel="stylesheet" href="/style/components.css">
    <link rel="stylesheet" href="/style/dashboard.css">
    <link rel="stylesheet" href="/style/responsive.css">
    <link rel="stylesheet" href="/style/sporthub-legacy-pages.css">
</head>

<body>
    <main class="sh-main-content">

        <header class="sh-legacy-header">
            <div>
                <div class="sh-legacy-eyebrow">
                    SPORTHUB / КАТАЛОГ
                </div>

                <h1>
                    <i class="fas fa-users me-2"></i>
                    Команди
                </h1>

                <p>
                    Знаходьте команди за видом спорту,
                    переглядайте їхній склад
                    та керуйте власними командами.
                </p>
            </div>

            <button
                type="button"
                class="btn btn-primary"
                id="createTeamBtn"
                style="display:none">

                <i class="fas fa-plus me-2"></i>
                Створити команду
            </button>
        </header>

        <section class="card mb-4">
            <div class="card-body p-4">

                <div class="d-flex flex-wrap align-items-center
                            justify-content-between gap-3 mb-3">

                    <div>
                        <h2 class="h5 fw-bold mb-1">
                            Каталог команд
                        </h2>

                        <p class="text-muted mb-0">
                            Пошук та фільтрація команд
                        </p>
                    </div>

                    <span class="sh-pill">
                        <i class="fas fa-filter me-2"></i>
                        Вид спорту обирається у верхньому меню
                    </span>
                </div>

                <label
                    class="form-label fw-semibold"
                    for="teamSearchInput">

                    Пошук за назвою
                </label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fas fa-search"></i>
                    </span>

                    <input
                        type="search"
                        class="form-control"
                        id="teamSearchInput"
                        placeholder="Введіть назву команди..."
                        autocomplete="off">
                </div>
            </div>
        </section>

        <section aria-label="Список команд">
            <div id="teamsList" class="row g-4">
                <div class="col-12 text-center text-muted py-5">
                    <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
                    <p>Завантаження команд...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal: створення команди -->
    <div
        class="modal fade"
        id="createTeamModal"
        tabindex="-1"
        aria-labelledby="createTeamModalTitle"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h2 class="modal-title fs-5"
                        id="createTeamModalTitle">

                        <i class="fas fa-plus-circle me-2"></i>
                        Створити команду
                    </h2>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Закрити">
                    </button>
                </div>

                <div class="modal-body">
                    <form id="createTeamForm">

                        <div class="mb-3">
                            <label class="form-label"
                                   for="newTeamName">
                                Назва команди
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="teamName"
                                id="newTeamName"
                                maxlength="100"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"
                                   for="newTeamDescription">
                                Опис команди
                            </label>

                            <textarea
                                class="form-control"
                                name="teamDescription"
                                id="newTeamDescription"
                                rows="3">
                            </textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"
                                   for="teamSportSelect">
                                Вид спорту
                            </label>

                            <select
                                class="form-select"
                                name="sportName"
                                id="teamSportSelect">

                                <option value="Football">⚽ Футбол</option>
                                <option value="Basketball">🏀 Баскетбол</option>
                                <option value="Volleyball">🏐 Волейбол</option>
                                <option value="Handball">🤾 Гандбол</option>
                                <option value="Tennis">🎾 Теніс</option>
                                <option value="Boxing">🥊 Бокс</option>
                                <option value="Judo">🥋 Дзюдо</option>
                                <option value="Karate">🥋 Карате</option>
                                <option value="Chess">♟️ Шахи</option>
                                <option value="Checkers">⬛ Шашки</option>
                                <option value="Contr_Strike_2">🎯 CS2</option>
                                <option value="Dota_2">🗡️ Dota 2</option>
                                <option value="Mobile_Legends_Bang_Bang">📱 MLBB</option>
                                <option value="Hearts_of_Iron_4">🌍 Hearts of Iron IV</option>
                                <option value="Civilization_6">🏛️ Civilization VI</option>
                            </select>
                        </div>

                    </form>
                </div>

                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        data-bs-dismiss="modal">
                        Скасувати
                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        id="submitTeamBtn">
                        Створити
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/logic/api/config.js"></script>
    <script src="/logic/api/authApi.js"></script>
    <script src="/logic/api/teamsApi.js"></script>
    <script src="/logic/api/savedItemsApi.js"></script>

    <script src="/logic/utils/dateFormatter.js"></script>
    <script src="/logic/utils/notifications.js"></script>

    <script src="/logic/components/searchBar.js"></script>
    <script src="/logic/components/siteLayout.js"></script>

    <script src="/logic/pages/teams.js"></script>
</body>
</html>
