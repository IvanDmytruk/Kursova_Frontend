<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Обране — SportHub</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/style/main.css">
    <link rel="stylesheet" href="/style/components.css">
    <link rel="stylesheet" href="/style/dashboard.css">
    <link rel="stylesheet" href="/style/responsive.css">
    <link rel="stylesheet" href="/style/matches.css">
    <link rel="stylesheet" href="/style/sporthub-legacy-pages.css">
</head>

<body>
    <main class="sh-main-content">

        <header class="sh-legacy-header">
            <div>
                <div class="sh-legacy-eyebrow">
                    SPORTHUB / ОСОБИСТЕ
                </div>

                <h1>
                    <i class="fas fa-bookmark me-2"></i>
                    Обране
                </h1>

                <p>
                    Збережені матчі, команди та турніри
                    в одному місці.
                </p>
            </div>
        </header>

        <section class="card">
            <div class="card-body p-4">

                <ul
                    class="nav nav-tabs mb-4"
                    id="savedTabs"
                    role="tablist">

                    <li class="nav-item" role="presentation">
                        <button
                            class="nav-link active"
                            id="saved-matches-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#savedMatches"
                            type="button"
                            role="tab"
                            aria-controls="savedMatches"
                            aria-selected="true">

                            <i class="fas fa-futbol me-1"></i>
                            Матчі

                            <span
                                id="savedMatchesCount"
                                class="badge bg-secondary ms-1">
                                0
                            </span>
                        </button>
                    </li>

                    <li class="nav-item" role="presentation">
                        <button
                            class="nav-link"
                            id="saved-teams-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#savedTeams"
                            type="button"
                            role="tab"
                            aria-controls="savedTeams"
                            aria-selected="false">

                            <i class="fas fa-users me-1"></i>
                            Команди

                            <span
                                id="savedTeamsCount"
                                class="badge bg-secondary ms-1">
                                0
                            </span>
                        </button>
                    </li>

                    <li class="nav-item" role="presentation">
                        <button
                            class="nav-link"
                            id="saved-tournaments-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#savedTournaments"
                            type="button"
                            role="tab"
                            aria-controls="savedTournaments"
                            aria-selected="false">

                            <i class="fas fa-trophy me-1"></i>
                            Турніри

                            <span
                                id="savedTournamentsCount"
                                class="badge bg-secondary ms-1">
                                0
                            </span>
                        </button>
                    </li>
                </ul>

                <div class="tab-content">

                    <div
                        class="tab-pane fade show active"
                        id="savedMatches"
                        role="tabpanel"
                        aria-labelledby="saved-matches-tab">

                        <div id="savedMatchesList" class="row g-3">
                            <div class="col-12 sh-collection-empty">
                                <i class="far fa-bookmark fa-2x mb-3"></i>
                                <p>Завантаження збережених матчів...</p>
                            </div>
                        </div>
                    </div>

                    <div
                        class="tab-pane fade"
                        id="savedTeams"
                        role="tabpanel"
                        aria-labelledby="saved-teams-tab">

                        <div id="savedTeamsList" class="row g-3">
                            <div class="col-12 sh-collection-empty">
                                <i class="fas fa-users fa-2x mb-3"></i>
                                <p>Завантаження збережених команд...</p>
                            </div>
                        </div>
                    </div>

                    <div
                        class="tab-pane fade"
                        id="savedTournaments"
                        role="tabpanel"
                        aria-labelledby="saved-tournaments-tab">

                        <div id="savedTournamentsList" class="row g-3">
                            <div class="col-12 sh-collection-empty">
                                <i class="fas fa-trophy fa-2x mb-3"></i>
                                <p>Завантаження збережених турнірів...</p>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/logic/api/config.js"></script>
    <script src="/logic/api/authApi.js"></script>
    <script src="/logic/api/matchesApi.js"></script>
    <script src="/logic/api/teamsApi.js"></script>
    <script src="/logic/api/tournamentsApi.js"></script>
    <script src="/logic/api/savedItemsApi.js"></script>

    <script src="/logic/utils/dateFormatter.js"></script>
    <script src="/logic/utils/notifications.js"></script>

    <script src="/logic/components/searchBar.js"></script>
    <script src="/logic/components/siteLayout.js"></script>

    <script src="/logic/pages/saved.js"></script>
</body>
</html>
