
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Огляд турніру — SportHub</title>

    <!-- Бібліотеки -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    >
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- Стилі SportHub -->
    <link rel="stylesheet" href="/style/main.css">
    <link rel="stylesheet" href="/style/components.css">
    <link rel="stylesheet" href="/style/dashboard.css">
    <link rel="stylesheet" href="/style/responsive.css">
    <link rel="stylesheet" href="/style/sporthub-views.css">
</head>

<body>

    <!-- Основний контент -->
    <main class="sh-view" id="mainContent">

        <!-- Заголовок сторінки -->
        <header class="sh-view-header">

            <div>
                <div class="sh-eyebrow">
                    SportHub · Турніри
                </div>

                <h1 id="viewTitle">
                    Огляд турніру
                </h1>

                <p id="viewSubtitle">
                    Формат, учасники й останні матчі
                </p>
            </div>

            <!-- Кнопки керування -->
            <div class="sh-view-actions">

                <a
                    class="btn btn-outline-primary"
                    id="viewBack"
                    href="/pages/tournaments.html"
                >
                    До турніру
                </a>

                <button
                    class="btn btn-primary"
                    id="viewReload"
                    type="button"
                >
                    <i class="fas fa-rotate me-1"></i>
                    Оновити
                </button>

            </div>
        </header>

        <!-- Повідомлення та помилки -->
        <div id="viewAlert" hidden></div>

        <!-- Основна сітка сторінки -->
        <div class="sh-view-grid">

            <!-- Центральна частина -->
            <div id="viewBody">

                <!-- Основні показники турніру -->
                <div
                    class="sh-metrics"
                    id="overviewMetrics"
                ></div>

                <!-- Інформація про формат і стан -->
                <section class="sh-card">

                    <h2>Формат і стан</h2>

                    <div
                        id="overviewDescription"
                        class="sh-muted"
                    >
                        Завантаження...
                    </div>

                </section>

                <!-- Останні матчі -->
                <section class="sh-card">

                    <h2>Останні матчі</h2>

                    <div id="overviewMatches"></div>

                </section>

                <!-- Учасники турніру -->
                <section class="sh-card">

                    <h2>Учасники</h2>

                    <div id="overviewParticipants"></div>

                </section>

            </div>

            <!-- Бічна панель -->
            <aside id="viewSidebar"></aside>

        </div>

    </main>

    <!-- API -->
    <script src="/logic/api/config.js"></script>
    <script src="/logic/api/authApi.js"></script>
    <script src="/logic/api/teamsApi.js"></script>
    <script src="/logic/api/tournamentsApi.js"></script>
    <script src="/logic/api/matchesApi.js"></script>
    <script src="/logic/api/tournamentManagementApi.js"></script>

    <!-- Спільні компоненти -->
    <script src="/logic/components/sporthubContext.js"></script>
    <script src="/logic/components/siteLayout.js"></script>

    <!-- Логіка сторінки -->
    <script src="/logic/pages/tournamentOverviewView.js"></script>

</body>
</html>
