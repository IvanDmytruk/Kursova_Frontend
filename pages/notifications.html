
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Мої повідомлення — SportHub</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/style/main.css">
    <link rel="stylesheet" href="/style/components.css">
    <link rel="stylesheet" href="/style/dashboard.css">
    <link rel="stylesheet" href="/style/responsive.css">
    <link rel="stylesheet" href="/style/sporthub-views.css">
    <link rel="stylesheet" href="/style/sporthub-legacy-pages.css">
</head>

<body>
<main class="sh-view" id="mainContent">
    <header class="sh-view-header">
        <div>
            <div class="sh-eyebrow">
                SportHub · Особисте
            </div>

            <h1>
                <i class="far fa-bell me-2"></i>
                Повідомлення
            </h1>

            <p>
                Історія призначень і перенесень матчів
            </p>
        </div>

        <div class="sh-view-actions">
            <button
                id="readAllNotifications"
                class="btn btn-outline-primary"
                type="button">
                Прочитати всі
            </button>

            <button
                id="reloadNotifications"
                class="btn btn-primary"
                type="button">
                Оновити
            </button>
        </div>
    </header>

    <div id="notificationsAlert" hidden></div>

    <section class="sh-card mb-4">

        <div class="d-flex flex-wrap justify-content-between
                    align-items-center gap-3 mb-4">

            <div>
                <h2 class="h5 fw-bold mb-1">
                    Історія повідомлень
                </h2>

                <span
                    id="unreadNotificationCount"
                    class="text-muted">
                    Завантаження...
                </span>
            </div>

            <label class="form-check">
                <input
                    id="unreadOnly"
                    class="form-check-input"
                    type="checkbox">

                <span class="form-check-label">
                    Тільки непрочитані
                </span>
            </label>
        </div>

        <div id="notificationsList">
            <p class="text-muted">
                Завантаження повідомлень...
            </p>
        </div>

        <div class="d-flex justify-content-center mt-4">
            <button
                id="loadMoreNotifications"
                class="btn btn-outline-primary"
                type="button"
                hidden>
                Завантажити ще
            </button>
        </div>
    </section>

    <section class="sh-card">
        <h2 class="h5 fw-bold mb-3">
            Запрошення та заявки
        </h2>

        <p class="text-muted">
            Запрошення до команд і турнірів
            залишаються доступними в особистому профілі.
        </p>

        <div class="d-flex flex-wrap gap-2">
            <a
                href="/pages/profile.html?tab=invitations"
                class="btn btn-outline-primary">
                Запрошення до команд
            </a>

            <a
                href="/pages/profile.html?tab=participation"
                class="btn btn-outline-primary">
                Заявки на турніри
            </a>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script src="/logic/api/config.js"></script>
<script src="/logic/api/authApi.js"></script>
<script src="/logic/api/sportHubNotificationsApi.js"></script>

<script src="/logic/components/siteLayout.js"></script>
<script src="/logic/pages/notificationsPage.js"></script>
</body>
</html>
