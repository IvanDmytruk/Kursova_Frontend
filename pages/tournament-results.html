
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Матчі та результати — SportHub</title>

    <!-- Бібліотеки -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    >
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- Стилі SportHub -->
    <link rel="stylesheet" href="/style/main.css">
    <link rel="stylesheet" href="/style/components.css">
    <link rel="stylesheet" href="/style/dashboard.css">
    <link rel="stylesheet" href="/style/responsive.css">
    <link rel="stylesheet" href="/style/sporthub-views.css">
</head>

<body>

    <!-- Основний контент -->
    <main class="sh-view" id="mainContent">

        <!-- Заголовок сторінки -->
        <header class="sh-view-header">

            <div>
                <div class="sh-eyebrow">
                    SportHub · Турніри
                </div>

                <h1 id="viewTitle">
                    Матчі та результати
                </h1>

                <p id="viewSubtitle">
                    Раунди, групи, рахунки й переходи до введення результатів
                </p>
            </div>

            <!-- Кнопки керування -->
            <div class="sh-view-actions">

                <a
                    class="btn btn-outline-primary"
                    id="viewBack"
                    href="/pages/tournaments.html"
                >
                    До турніру
                </a>

                <button
                    class="btn btn-primary"
                    id="viewReload"
                    type="button"
                >
                    <i class="fas fa-rotate me-1"></i>
                    Оновити
                </button>

            </div>
        </header>

        <!-- Повідомлення та помилки -->
        <div id="viewAlert" hidden></div>

        <!-- Основна сітка сторінки -->
        <div class="sh-view-grid">

            <!-- Центральна частина -->
            <div id="viewBody">

                <!-- Матчі та результати -->
                <section class="sh-card">

                    <!-- Фільтри -->
                    <div class="d-flex flex-wrap gap-3 align-items-center mb-3">

                        <!-- Фільтр за раундом -->
                        <label
                            class="form-label mb-0"
                            for="roundFilter"
                        >
                            Раунд
                        </label>

                        <select
                            class="form-select"
                            style="max-width:180px"
                            id="roundFilter"
                        >
                            <option value="">
                                Усі раунди
                            </option>
                        </select>

                        <!-- Фільтр за статусом -->
                        <label
                            class="form-label mb-0"
                            for="statusFilter"
                        >
                            Статус
                        </label>

                        <select
                            class="form-select"
                            style="max-width:180px"
                            id="statusFilter"
                        >
                            <option value="">
                                Усі статуси
                            </option>

                            <option value="done">
                                З результатом
                            </option>

                            <option value="pending">
                                Без результату
                            </option>
                        </select>

                    </div>

                    <!-- Список матчів -->
                    <div id="resultsMatches"></div>

                </section>

            </div>

            <!-- Бічна панель -->
            <aside id="viewSidebar"></aside>

        </div>

    </main>

    <!-- API -->
    <script src="/logic/api/config.js"></script>
    <script src="/logic/api/authApi.js"></script>
    <script src="/logic/api/teamsApi.js"></script>
    <script src="/logic/api/tournamentsApi.js"></script>
    <script src="/logic/api/matchesApi.js"></script>
    <script src="/logic/api/tournamentManagementApi.js"></script>

    <!-- Спільні компоненти -->
    <script src="/logic/components/sporthubContext.js"></script>
    <script src="/logic/components/siteLayout.js"></script>

    <!-- Логіка сторінки -->
    <script src="/logic/pages/tournamentResultsView.js"></script>

</body>
</html>
